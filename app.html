<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal ZMART BIMBEL 123</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#4a1d96;--p2:#6d3fc4;--pd:#2e1065;--y:#ffc21a;--lav:#f4efff;--ink:#241a3d;--mut:#6b6385;--ok:#17803d;--bad:#b42318;--line:#e2d9f5}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--lav);color:var(--ink)}
button,input,select{font:inherit}
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 8px 28px rgba(74,29,150,.12)}
#login .card{width:100%;max-width:380px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand img{width:48px;height:48px;object-fit:contain;border-radius:10px;background:#fff}
.brand b{display:block;font-size:18px;font-weight:800;color:var(--p)}
.brand small{color:var(--mut)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--y);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--y);color:var(--pd)}
.btn.alt{background:#fff;border:1.5px solid var(--line);color:var(--p);font-weight:600}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.full{width:100%;margin-top:18px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--p);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside .brand b{color:#fff}aside .brand small{color:#d8c8ff}
aside nav{display:flex;flex-direction:column;gap:4px;margin-top:8px}
aside nav button{background:none;border:0;color:#fff;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;border-left:4px solid transparent}
aside nav button.on{background:var(--p2);border-left-color:var(--y)}
.who{margin-top:auto;font-size:13px;color:#d8c8ff}
.who b{display:block;color:#fff}
main{padding:26px;min-width:0}
h2{margin:0 0 4px;font-size:24px;color:var(--pd)}
.sub{color:var(--mut);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border-radius:14px;padding:16px;border-top:5px solid var(--y)}
.stat span{color:var(--mut);font-size:14px}.stat b{display:block;font-size:30px;color:var(--p)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tw{overflow-x:auto;background:#fff;border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
th{background:#faf7ff;color:var(--mut);font-weight:600}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;background:#e6f6ec;color:var(--ok)}
.pill.off{background:#fde8e6;color:var(--bad)}
.act{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--mut)}
dialog{border:0;border-radius:16px;padding:24px;width:min(420px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(36,26,61,.5)}
dialog h3{margin:0 0 4px;color:var(--pd)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#toast{position:fixed;right:16px;bottom:16px;z-index:9;padding:12px 16px;border-radius:12px;color:#fff;font-weight:600;max-width:90vw;background:var(--ok)}
#toast.bad{background:var(--bad)}
@media(max-width:800px){
#app{grid-template-columns:1fr}
aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
aside .brand{margin:0}aside nav{flex-direction:row;margin:0;overflow-x:auto}
.who{margin:0 0 0 auto}
main{padding:16px}
}
@media(prefers-reduced-motion:no-preference){.card{animation:in .4s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<section id="login">
  <form class="card" id="lf">
    <div class="brand"><img src="logo-zmart.png" alt="Logo"><div><b>ZMART BIMBEL 123</b><small>Smart Learning Portal</small></div></div>
    <label for="u">Username</label><input id="u" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="le" role="alert"></div>
    <button class="btn full" id="lb">Masuk</button>
  </form>
</section>
<div id="app" class="hide">
  <aside>
    <div class="brand"><img src="logo-zmart.png" alt=""><div><b>ZMART BIMBEL 123</b><small>Smart Learning Portal</small></div></div>
    <nav id="nav"></nav>
    <div class="who"><b id="wn"></b><span id="wr"></span><br><button class="btn alt sm" id="out" style="margin-top:8px">Keluar</button></div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" class="hide" role="status"></div>
<script>
const URL_='https://wqkkofstvedjqktabydc.supabase.co';
const KEY='ssb_publishable_zotCcwcPlAP2ebkCw3u6TQ_V-rlh2K9';
const sb=supabase.createClient(URL_,KEY);
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const ROLE={admin:'Admin',tutor:'Tentor',parent:'Orang Tua'};
let me=null,page='ringkasan',tt;

function toast(m,ok=true){const t=$('#toast');t.textContent=m;t.className=ok?'':'bad';clearTimeout(tt);tt=setTimeout(()=>t.className='hide',4500)}
const netErr=e=>e instanceof TypeError?'Koneksi database bermasalah. Periksa internet Anda.':e.message;

/* ---- Login ---- */
$('#lf').onsubmit=async e=>{
  e.preventDefault();$('#le').textContent='';$('#lb').disabled=true;
  try{
    const r=await fetch(URL_+'/functions/v1/username-login',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({username:$('#u').value.trim().toLowerCase(),password:$('#pw').value})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||'Login gagal.');
    const {error}=await sb.auth.setSession({access_token:j.session.access_token,refresh_token:j.session.refresh_token});
    if(error)throw error;
    $('#pw').value='';await enter();
  }catch(err){$('#le').textContent=netErr(err)}
  $('#lb').disabled=false;
};
$('#out').onclick=async()=>{await sb.auth.signOut();me=null;$('#app').classList.add('hide');$('#login').classList.remove('hide')};

async function enter(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return;
  const {data,error}=await sb.from('profiles').select('id,full_name,username,role,is_active').eq('id',user.id).maybeSingle();
  if(error||!data||!data.is_active){await sb.auth.signOut();$('#le').textContent='Akun tidak aktif atau tidak ditemukan.';return}
  me=data;
  $('#login').classList.add('hide');$('#app').classList.remove('hide');
  $('#wn').textContent=me.full_name||me.username;$('#wr').textContent=ROLE[me.role]||me.role;
  const nav={admin:[['ringkasan','Ringkasan'],['siswa','Data Siswa'],['akun','Akun Tentor & Orang Tua']],tutor:[['siswa','Siswa Saya']],parent:[['siswa','Anak Saya']]}[me.role]||[];
  page=nav[0][0];
  $('#nav').innerHTML=nav.map(n=>`<button data-p="${n[0]}">${n[1]}</button>`).join('');
  $('#nav').onclick=e=>{const b=e.target.closest('button');if(b){page=b.dataset.p;draw()}};
  draw();
}

function draw(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===page));
  $('#main').innerHTML='<p class="sub">Memuat data…</p>';
  ({ringkasan:pRingkasan,siswa:pSiswa,akun:pAkun})[page]().catch(e=>{$('#main').innerHTML=`<div class="card empty">Data gagal dimuat: ${esc(netErr(e))}</div>`});
}

/* ---- Form dialog ---- */
function form(title,fields,vals,save){
  const d=$('#dlg');
  d.innerHTML=`<form><h3>${esc(title)}</h3>${fields.map(f=>`<label for="f_${f.k}">${esc(f.l)}</label>`+(f.opts?`<select id="f_${f.k}">${f.opts.map(o=>`<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" ${f.req?'required':''} ${f.min!=null?`min="${f.min}"`:''} autocomplete="off">`)).join('')}<div class="err" id="fe" role="alert"></div><div class="row"><button type="button" class="btn alt" id="fc">Batal</button><button class="btn" id="fs">Simpan</button></div></form>`;
  fields.forEach(f=>{const el=$('#f_'+f.k);if(vals&&vals[f.k]!=null)el.value=vals[f.k]});
  $('#fc').onclick=()=>d.close();
  d.querySelector('form').onsubmit=async e=>{
    e.preventDefault();$('#fs').disabled=true;
    const o={};fields.forEach(f=>o[f.k]=$('#f_'+f.k).value.trim());
    try{const m=await save(o);toast(m||'Data berhasil disimpan');d.close();draw()}
    catch(err){$('#fe').textContent='Data gagal disimpan: '+netErr(err)}
    $('#fs').disabled=false;
  };
  d.showModal();
}

/* ---- Ringkasan (admin) ---- */
async function pRingkasan(){
  const cnt=(t,f)=>{let q=sb.from(t).select('*',{count:'exact',head:true});return f(q).then(r=>{if(r.error)throw r.error;return r.count})};
  const [s,t,p,k]=await Promise.all([
    cnt('students',q=>q.eq('is_active',true)),
    cnt('profiles',q=>q.eq('role','tutor').eq('is_active',true)),
    cnt('profiles',q=>q.eq('role','parent').eq('is_active',true)),
    cnt('payments',q=>q.eq('status','pending'))]);
  $('#main').innerHTML=`<h2>Ringkasan</h2><p class="sub">Halo, ${esc(me.full_name||me.username)}. Berikut kondisi bimbel saat ini.</p>
  <div class="stats"><div class="stat"><span>Siswa aktif</span><b>${s}</b></div><div class="stat"><span>Tentor aktif</span><b>${t}</b></div><div class="stat"><span>Akun orang tua aktif</span><b>${p}</b></div><div class="stat"><span>Tagihan belum lunas</span><b>${k}</b></div></div>`;
}

/* ---- Siswa ---- */
const SF=[{k:'full_name',l:'Nama siswa',req:1},{k:'grade',l:'Kelas'},{k:'program',l:'Program belajar'},{k:'enrollment_date',l:'Tanggal masuk',t:'date'},{k:'monthly_fee',l:'Biaya per bulan (Rp)',t:'number',min:0}];
async function pSiswa(){
  const {data,error}=await sb.from('students').select('*').order('full_name');
  if(error)throw error;
  const adm=me.role==='admin';
  window._st=data;
  $('#main').innerHTML=`<div class="bar"><div><h2>${adm?'Data Siswa':me.role==='tutor'?'Siswa Saya':'Anak Saya'}</h2><p class="sub" style="margin:0">${data.length} siswa</p></div>${adm?'<button class="btn" id="add">Tambah siswa</button>':''}</div>
  <div class="tw">${data.length?`<table><thead><tr><th>Nama</th><th>Kelas</th><th>Program</th>${adm?'<th>Biaya/bulan</th>':''}<th>Status</th>${adm?'<th>Aksi</th>':''}</tr></thead><tbody>${data.map((s,i)=>`<tr><td>${esc(s.full_name)}</td><td>${esc(s.grade)}</td><td>${esc(s.program)}</td>${adm?`<td>${rp(s.monthly_fee)}</td>`:''}<td><span class="pill ${s.is_active?'':'off'}">${s.is_active?'Aktif':'Nonaktif'}</span></td>${adm?`<td class="act"><button class="btn alt sm" data-e="${i}">Ubah</button><button class="btn alt sm" data-h="${i}">Hubungkan</button><button class="btn alt sm" data-t="${i}">${s.is_active?'Nonaktifkan':'Aktifkan'}</button></td>`:''}</tr>`).join('')}</tbody></table>`:'<div class="empty">Belum ada siswa. '+(adm?'Klik “Tambah siswa” untuk memulai.':'Hubungi admin untuk menghubungkan akun Anda dengan siswa.')+'</div>'}</div>`;
  if(!adm)return;
  const clean=o=>({full_name:o.full_name,grade:o.grade||null,program:o.program||null,enrollment_date:o.enrollment_date||null,monthly_fee:o.monthly_fee===''?0:Number(o.monthly_fee)});
  $('#add').onclick=()=>form('Tambah siswa',SF,{enrollment_date:new Date().toISOString().slice(0,10)},async o=>{const {error}=await sb.from('students').insert(clean(o));if(error)throw error});
  $('#main').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.e!=null){const s=window._st[b.dataset.e];form('Ubah data siswa',SF,s,async o=>{const {error}=await sb.from('students').update(clean(o)).eq('id',s.id);if(error)throw error;return'Data berhasil diperbarui'})}
    if(b.dataset.h!=null)link(window._st[b.dataset.h]);
    if(b.dataset.t!=null){const s=window._st[b.dataset.t];sb.from('students').update({is_active:!s.is_active}).eq('id',s.id).then(({error})=>{if(error)toast('Data gagal disimpan: '+error.message,false);else{toast('Data berhasil diperbarui');draw()}},e=>toast(netErr(e),false))}
  };
}

/* ---- Hubungkan siswa dengan tentor & orang tua ---- */
async function link(s){
  try{
    const [pr,ts,sg]=await Promise.all([
      sb.from('profiles').select('id,full_name,username,role').in('role',['tutor','parent']).eq('is_active',true).order('full_name'),
      sb.from('tutor_students').select('tutor_id').eq('student_id',s.id),
      sb.from('student_guardians').select('parent_id').eq('student_id',s.id)]);
    const er=pr.error||ts.error||sg.error;if(er)throw er;
    const T=pr.data.filter(x=>x.role==='tutor'),P=pr.data.filter(x=>x.role==='parent');
    const ht=new Set(ts.data.map(r=>r.tutor_id)),hp=new Set(sg.data.map(r=>r.parent_id));
    const box=(list,set,n)=>list.length?list.map(a=>`<label style="font-weight:400;display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" name="${n}" value="${a.id}" ${set.has(a.id)?'checked':''}>${esc(a.full_name)} (${esc(a.username)})</label>`).join(''):'<p class="sub">Belum ada akun. Buat dulu di menu Akun.</p>';
    const d=$('#dlg');
    d.innerHTML=`<form><h3>Hubungkan: ${esc(s.full_name)}</h3><label>Tentor pengajar</label>${box(T,ht,'t')}<label>Orang tua (satu orang tua boleh punya beberapa anak)</label>${box(P,hp,'p')}<div class="err" id="fe" role="alert"></div><div class="row"><button type="button" class="btn alt" id="fc">Batal</button><button class="btn" id="fs">Simpan</button></div></form>`;
    $('#fc').onclick=()=>d.close();
    d.querySelector('form').onsubmit=async e=>{
      e.preventDefault();$('#fs').disabled=true;
      try{
        const sel=n=>new Set([...d.querySelectorAll(`input[name=${n}]:checked`)].map(i=>i.value));
        const jobs=[];
        const sync=(tbl,col,cur,nw)=>{
          const ins=[...nw].filter(x=>!cur.has(x)).map(x=>({student_id:s.id,[col]:x}));
          const del=[...cur].filter(x=>!nw.has(x));
          if(ins.length)jobs.push(sb.from(tbl).insert(ins));
          if(del.length)jobs.push(sb.from(tbl).delete().eq('student_id',s.id).in(col,del));
        };
        sync('tutor_students','tutor_id',ht,sel('t'));sync('student_guardians','parent_id',hp,sel('p'));
        const bad=(await Promise.all(jobs)).find(r=>r.error);if(bad)throw bad.error;
        toast('Data berhasil disimpan');d.close();
      }catch(err){$('#fe').textContent='Data gagal disimpan: '+netErr(err)}
      $('#fs').disabled=false;
    };
    d.showModal();
  }catch(err){toast('Data gagal dimuat: '+netErr(err),false)}
}

/* ---- Akun tentor & orang tua ---- */
async function adminFn(body){
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch(URL_+'/functions/v1/admin-users',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Permintaan gagal.');
  return j;
}
async function pAkun(){
  const {data,error}=await sb.from('profiles').select('id,full_name,username,role,is_active').neq('role','admin').order('role').order('full_name');
  if(error)throw error;
  window._ak=data;
  $('#main').innerHTML=`<div class="bar"><div><h2>Akun Tentor & Orang Tua</h2><p class="sub" style="margin:0">${data.length} akun</p></div><button class="btn" id="add">Buat akun</button></div>
  <div class="tw">${data.length?`<table><thead><tr><th>Nama</th><th>Username</th><th>Peran</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${data.map((a,i)=>`<tr><td>${esc(a.full_name)}</td><td>${esc(a.username)}</td><td>${ROLE[a.role]||esc(a.role)}</td><td><span class="pill ${a.is_active?'':'off'}">${a.is_active?'Aktif':'Nonaktif'}</span></td><td class="act"><button class="btn alt sm" data-r="${i}">Atur ulang password</button><button class="btn alt sm" data-t="${i}">${a.is_active?'Nonaktifkan':'Aktifkan'}</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Belum ada akun. Klik “Buat akun” untuk membuat akun tentor atau orang tua.</div>'}</div>`;
  $('#add').onclick=()=>form('Buat akun',[{k:'full_name',l:'Nama lengkap',req:1},{k:'username',l:'Username (huruf kecil, angka, titik, minus)',req:1},{k:'role',l:'Peran',opts:[['tutor','Tentor'],['parent','Orang Tua']]},{k:'password',l:'Password (minimal 8 karakter)',t:'password',req:1}],null,async o=>{await adminFn({action:'create_user',...o,username:o.username.toLowerCase()})});
  $('#main').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.r!=null){const a=window._ak[b.dataset.r];form('Atur ulang password: '+a.username,[{k:'password',l:'Password baru (minimal 8 karakter)',t:'password',req:1}],null,async o=>{await adminFn({action:'reset_password',user_id:a.id,password:o.password});return'Password berhasil diperbarui'})}
    if(b.dataset.t!=null){const a=window._ak[b.dataset.t];sb.from('profiles').update({is_active:!a.is_active}).eq('id',a.id).then(({error})=>{if(error)toast('Data gagal disimpan: '+error.message,false);else{toast('Data berhasil diperbarui');draw()}},e=>toast(netErr(e),false))}
  };
}

/* ---- Mulai ---- */
(async()=>{try{const {data:{session}}=await sb.auth.getSession();if(session)await enter()}catch(e){$('#le').textContent=netErr(e)}})();
</script>
</body>
</html>
